<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NA-ive Wallpapers</title>

    <!-- Meta Tags -->
    <meta name="description" content="A curated collection of high-quality wallpapers for your desktop and mobile devices.">
    <meta name="theme-color" content="#131313">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://na-ive.github.io/wallpapers/">
    <meta property="og:title" content="NA-ive Wallpapers">
    <meta property="og:description" content="A curated collection of high-quality wallpapers for your desktop and mobile devices.">
    <meta property="og:image" content="https://na-ive.github.io/wallpapers/thumbnails/thumb_social_preview.webp">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="NA-ive Wallpapers">
    <meta property="twitter:description" content="A curated collection of high-quality wallpapers for your desktop and mobile devices.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="style.css?v=2">
    <script defer src="https://unpkg.com/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        
        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            font-family: 'Google Sans Flex', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            /* Smooth crossfade when the dynamic color scheme swaps */
            transition: background-color 0.5s cubic-bezier(0.2, 0, 0, 1),
                        color 0.5s cubic-bezier(0.2, 0, 0, 1);
        }

        /* Material Symbols (Rounded): variable axes must be set explicitly; icons
           inherit their size from the parent (or Tailwind text-* utilities). */
        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .m3-transition {
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        /* M3 Card: default shape is "medium" (12dp); elevation rises from level 0 to level 2 on hover */
        .m3-card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 12px;
            /* Ultimate fix for Safari/Chrome rounded corner anti-aliasing bleed with overflow: hidden */
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            mask-image: radial-gradient(white, black);
            box-shadow: var(--md-sys-elevation-0, none);
            will-change: transform, box-shadow, opacity;
            transition: background-color 0.5s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.3s cubic-bezier(0.2, 0, 0, 1),
                        transform 0.4s cubic-bezier(0.2, 0, 0, 1),
                        translate 0.4s cubic-bezier(0.2, 0, 0, 1),
                        opacity 0.4s cubic-bezier(0.2, 0, 0, 1);
        }

        .m3-card:hover {
            background-color: var(--md-sys-color-surface-container-high);
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-2px);
        }

        /* M3 state layer: consistent hover/focus/pressed opacities instead of arbitrary /10 /20 values */
        .m3-state {
            position: relative;
        }
        .m3-state::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background-color: currentColor;
            opacity: 0;
            transition: opacity 0.15s cubic-bezier(0.2, 0, 0, 1);
            pointer-events: none;
        }
        .m3-state:hover::after { opacity: var(--md-sys-state-hover-opacity); }
        .m3-state:focus-visible::after { opacity: var(--md-sys-state-focus-opacity); }
        .m3-state:active::after { opacity: var(--md-sys-state-pressed-opacity); }

        /* Ripple Effect */
        .m3-ripple {
            overflow: hidden;
        }
        .m3-ripple:not(.fixed):not(.absolute) {
            position: relative;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 600ms linear;
            background-color: currentColor;
            opacity: 0.12;
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Visible keyboard focus ring (accessibility floor) */
        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 2px solid var(--md-sys-color-primary, #c7bfff);
            outline-offset: 2px;
        }

        /* M3 Extended FAB, medium size: 80dp height, 20dp corner radius,
           elevation level 3 at rest, level 4 on hover, level 1 while pressed */
        .m3-fab-extended {
            box-shadow: var(--md-sys-elevation-3) !important;
        }
        .m3-fab-extended:hover {
            background-color: color-mix(in srgb, var(--md-sys-color-primary-container) 88%, var(--md-sys-color-on-primary-container));
            box-shadow: var(--md-sys-elevation-3) !important;
        }
        .m3-fab-extended:active {
            box-shadow: var(--md-sys-elevation-1) !important;
        }

        /* Top app bar gains elevation once content scrolls under it */
        .m3-appbar-elevated {
            box-shadow: var(--md-sys-elevation-2);
            background-color: var(--md-sys-color-surface);
        }

        @media (prefers-reduced-motion: reduce) {
            .m3-transition, .m3-card, .pill-btn, * {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        .skeleton {
            background: linear-gradient(90deg, var(--md-sys-color-surface-container) 25%, var(--md-sys-color-surface-container-high) 50%, var(--md-sys-color-surface-container) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: var(--md-sys-color-surface); }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: var(--md-sys-color-surface-variant); 
            border-radius: 10px;
        }

        /* M3 Segmented Button: shape is full at rest, not just on hover/active */
        .pill-btn {
            border-radius: 9999px !important;
            transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1), color 0.2s cubic-bezier(0.2, 0, 0, 1) !important;
        }

        /* M3 color swatch: shape itself carries selection state, not just color/border.
           Rest = circle. Selected = squircle with a halo ring. Same size in both states;
           radius uses height/2 (17px) instead of 9999 so the circle->squircle morph is smooth. */
        .m3-swatch {
            width: 34px;
            height: 34px;
            border-radius: 17px;
            box-shadow: 0 0 0 0 transparent;
            transition: border-radius 0.2s cubic-bezier(0.2, 0, 0, 1),
                        box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1),
                        opacity 0.2s ease;
        }
        .m3-swatch-selected {
            border-radius: 12px;
            box-shadow: 0 0 0 2px var(--md-sys-color-surface-container),
                        0 0 0 4px var(--md-sys-color-outline-variant),
                        var(--md-sys-elevation-1);
        }

        /* "All colors" swatch: rainbow conic gradient instead of a flat color */
        .m3-swatch-all {
            background: conic-gradient(from 0deg,
                #f44336, #ff9800, #ffeb3b, #4caf50, #2196f3, #9c27b0, #f44336);
        }
        .m3-swatch:active {
            transform: scale(0.9);
        }

        /* M3 Snackbar */
        .m3-snackbar {
            background-color: var(--md-sys-color-inverse-surface, #e5e1e9);
            color: var(--md-sys-color-inverse-on-surface, #2f2d33);
            border-radius: 4px;
            box-shadow: var(--md-sys-elevation-3);
        }

        /* Reusable M3 elevation utilities. Only surfaces that spec calls out as elevated
           get these: Card, FAB, Menu, Dialog, Snackbar. Buttons stay flat (level 0). */
        .m3-elev-1 { box-shadow: var(--md-sys-elevation-1); }
        .m3-elev-2 { box-shadow: var(--md-sys-elevation-2); }
        .m3-elev-3 { box-shadow: var(--md-sys-elevation-3); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* M3 type scale (condensed to the roles this UI actually uses).
           size / line-height / weight / tracking, per the M3 type spec. */
        .m3-title-large  { font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: 0; }
        .m3-title-medium { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; }
        .m3-body-medium  { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: 0.25px; }
        .m3-body-small   { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: 0.4px; }
        .m3-label-large  { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }
        .m3-label-medium { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }
        .m3-label-small  { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }
    </style>
</head>
<body x-data="galleryApp()" class="custom-scrollbar overflow-x-hidden">

    <!-- Header (M3 top app bar: gains elevation once content scrolls beneath it) -->
    <header x-data="{ scrolled: false }" @scroll.window="scrolled = window.scrollY > 4"
        class="sticky top-0 z-40 py-3 md:py-4 m3-transition"
        :class="scrolled ? 'm3-appbar-elevated' : 'bg-m3-surface'">
        <div class="container mx-auto px-1 flex items-center justify-between h-10 md:h-12 relative">
            
            <div class="flex items-center gap-1 shrink-0 cursor-pointer group" x-show="!searchOpen" @click="resetGallery()">
                <div class="w-12 h-12 flex items-center justify-center">
                    <img src="https://github.com/na-ive.png" alt="NA-ive" class="w-8 h-8 rounded-full m3-transition object-cover">
                </div>
                <h1 class="m3-title-large text-m3-onSurface whitespace-nowrap group-hover:text-m3-primary m3-transition">
                    <span class="md:hidden">NA-ive Walls</span>
                    <span class="hidden md:inline">NA-ive Wallpapers</span>
                </h1>
            </div>

            <div class="flex items-center gap-2 md:gap-4 flex-grow justify-end" :class="searchOpen ? 'w-full' : ''">
                
                <div class="relative flex items-center gap-2 md:gap-4 m3-transition" :class="searchOpen ? 'w-full' : 'w-auto'">
                    
                    <!-- Color Filter (Desktop): unselected = small dot, selected morphs into a
                         rounded square — same shape-as-state pattern Android's Material You
                         color picker uses, so the selection itself carries the shape change. -->
                    <div class="hidden lg:flex items-center gap-2 no-scrollbar overflow-x-auto max-w-xs xl:max-w-md py-2 px-2">
                        <button @click="selectedColor = ''; window.scrollTo({ top: 0, behavior: 'smooth' })" 
                            class="m3-swatch m3-swatch-all cursor-pointer m3-transition shrink-0"
                            :class="selectedColor === '' ? 'm3-swatch-selected' : 'opacity-70 hover:opacity-100'"
                            :aria-pressed="selectedColor === ''"
                            title="All Colors">
                        </button>
                        <template x-for="color in colorGroups" :key="color">
                            <button @click="selectedColor = (selectedColor === color ? '' : color); window.scrollTo({ top: 0, behavior: 'smooth' })"
                                class="m3-swatch cursor-pointer m3-transition shrink-0"
                                :class="selectedColor === color ? 'm3-swatch-selected' : 'opacity-70 hover:opacity-100'"
                                :style="'background-color: ' + getColorHex(color)"
                                :aria-pressed="selectedColor === color"
                                :title="color">
                            </button>
                        </template>
                    </div>

                    <div class="hidden md:flex relative items-center w-64 lg:w-80">
                        <span class="material-symbols-rounded absolute left-4 text-m3-onSurfaceVariant text-[22px] pointer-events-none">search</span>
                        <input type="text" x-model="search" placeholder="Search wallpapers..." 
                            style="box-shadow: none !important; outline: none !important; border: none !important;"
                            class="m3-body-large w-full h-12 bg-m3-surfaceContainerHigh text-m3-onSurface border-none rounded-full pl-12 pr-12 focus:ring-0 focus:outline-none placeholder:text-m3-onSurfaceVariant m3-transition">
                        <button x-show="search" @click="search = ''" x-cloak
                            class="absolute right-2 w-8 h-8 flex items-center justify-center rounded-full text-m3-onSurfaceVariant hover:text-m3-onSurface hover:bg-m3-onSurface/10 m3-transition cursor-pointer">
                            <span class="material-symbols-rounded text-[22px]">close</span>
                        </button>
                    </div>

                    <div class="md:hidden absolute left-[12px] right-[12px] top-1/2 -translate-y-1/2 z-50 flex items-center h-14 bg-m3-surfaceContainerHigh rounded-full m3-transition" 
                         x-show="searchOpen" x-cloak 
                         x-transition:enter="transition ease-out duration-200" 
                         x-transition:enter-start="opacity-0 scale-95" 
                         x-transition:enter-end="opacity-100 scale-100" 
                         x-transition:leave="transition ease-in duration-150" 
                         x-transition:leave-start="opacity-100 scale-100" 
                         x-transition:leave-end="opacity-0 scale-95">
                        <button @click="searchOpen = false; search = ''" class="cursor-pointer w-12 h-12 flex items-center justify-center rounded-full ml-1 text-m3-onSurface hover:bg-m3-onSurface/10 m3-transition flex-shrink-0">
                            <span class="material-symbols-rounded text-[24px]">chevron_left</span>
                        </button>
                        <input type="text" x-model="search" placeholder="Search wallpapers..." autofocus
                            style="box-shadow: none !important; outline: none !important; border: none !important;"
                            class="m3-body-large w-full bg-transparent text-m3-onSurface border-none focus:ring-0 p-0 px-1 outline-none placeholder:text-m3-onSurfaceVariant">
                        <button x-show="search" @click="search = ''" class="cursor-pointer w-12 h-12 flex items-center justify-center rounded-full mr-1 text-m3-onSurfaceVariant hover:text-m3-onSurface hover:bg-m3-onSurface/10 m3-transition flex-shrink-0" x-cloak>
                            <span class="material-symbols-rounded text-[24px]">close</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-0 shrink-0" x-show="!searchOpen">
                    <button @click="searchOpen = true" x-show="!searchOpen" class="cursor-pointer md:hidden w-12 h-12 flex items-center justify-center rounded-full text-m3-onSurface m3-transition hover:bg-m3-surfaceVariant/20">
                        <span class="material-symbols-rounded text-[24px] leading-none">search</span>
                    </button>
                    <div class="md:hidden relative" x-data="{ open: false }">
                        <button @click="open = !open" class="cursor-pointer w-12 h-12 flex items-center justify-center rounded-full m3-transition hover:bg-m3-surfaceVariant/20" :class="selectedColor ? 'text-m3-primary' : 'text-m3-onSurface'">
                            <span class="material-symbols-rounded text-[18px] leading-none">palette</span>
                        </button>
                        <div x-show="open" @click.away="open = false" x-cloak
                            x-transition:enter="transition ease-out duration-300"
                            x-transition:enter-start="opacity-0 scale-95"
                            x-transition:enter-end="opacity-100 scale-100"
                            x-transition:leave="transition ease-in duration-200"
                            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                            x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                            class="absolute right-0 mt-2 w-48 bg-m3-surfaceContainer m3-elev-2 rounded-2xl z-50 overflow-hidden">
                            <div class="p-1 flex flex-col gap-[2px] max-h-64 overflow-y-auto custom-scrollbar">
                                <button @click="selectedColor = ''; open = false; window.scrollTo({ top: 0, behavior: 'smooth' })" 
                                    class="w-full h-12 rounded-[12px] m3-state m3-label-large cursor-pointer text-left px-3 m3-transition flex items-center justify-between"
                                    :class="selectedColor === '' ? 'bg-m3-tertiaryContainer text-m3-onTertiaryContainer' : 'text-m3-onSurface'">
                                    <div class="flex items-center gap-3">
                                        <div class="w-4 h-4 rounded-full shrink-0" style="background: conic-gradient(from 0deg, #f44336, #ff9800, #ffeb3b, #4caf50, #2196f3, #9c27b0, #f44336);"></div>
                                        <span>All Colors</span>
                                    </div>
                                    <span x-show="selectedColor === ''" class="material-symbols-rounded text-[20px]">check</span>
                                </button>
                                <template x-for="color in colorGroups" :key="color">
                                    <button @click="selectedColor = color; open = false; window.scrollTo({ top: 0, behavior: 'smooth' })" 
                                        class="w-full h-12 rounded-[12px] m3-state m3-label-large cursor-pointer text-left px-3 m3-transition flex items-center justify-between"
                                        :class="selectedColor === color ? 'bg-m3-tertiaryContainer text-m3-onTertiaryContainer' : 'text-m3-onSurface'">
                                        <div class="flex items-center gap-3">
                                            <div class="w-4 h-4 rounded-full border border-m3-outline/20" :style="'background-color: ' + getColorHex(color)"></div>
                                            <span x-text="color"></span>
                                        </div>
                                        <span x-show="selectedColor === color" class="material-symbols-rounded text-[20px]">check</span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>

                    <button @click="toggleDark()" :title="dark ? 'Switch to light mode' : 'Switch to dark mode'"
                        class="cursor-pointer w-12 h-12 flex items-center justify-center rounded-full m3-transition m3-ripple text-m3-onSurface hover:bg-m3-surfaceVariant/20">
                        <span class="material-symbols-rounded text-[24px] leading-none" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Gallery Grid -->
    <main class="container mx-auto px-4 pt-6 pb-28 md:pb-24">
        
        <!-- Skeleton Top Bar -->
        <div class="flex items-center justify-between mb-4 md:mb-6" x-show="loading">
            <div class="h-5 w-24 rounded-[4px] skeleton"></div>
            <div class="h-5 w-32 rounded-[4px] skeleton"></div>
        </div>

        <div class="flex items-center justify-between mb-4 md:mb-6" x-show="!loading && !fetchError" x-cloak>
            <div class="m3-label-large text-m3-onSurfaceVariant">
                <span x-text="filteredWallpapers().length"></span> Wallpapers
            </div>
            
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="flex items-center gap-1 m3-label-large text-m3-onSurface hover:text-m3-primary m3-transition cursor-pointer group">
                    <span class="text-m3-onSurfaceVariant font-normal">Sort by:</span> 
                    <span x-text="sortOptions.find(o => o.value === sortOrder)?.label || 'Newest'"></span>
                    <span class="material-symbols-rounded text-[20px] group-hover:translate-y-px m3-transition" :class="open ? 'rotate-180' : ''">arrow_drop_down</span>
                </button>
                <div x-show="open" @click.away="open = false" x-cloak
                    x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                    x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                    class="absolute right-0 mt-2 w-48 bg-m3-surfaceContainer m3-elev-2 rounded-2xl z-30 overflow-hidden">
                    <div class="p-1 flex flex-col gap-[2px]">
                        <template x-for="option in sortOptions" :key="option.value">
                            <button @click="sortOrder = option.value; open = false" 
                                class="w-full h-12 rounded-[12px] m3-state m3-label-large cursor-pointer text-left px-3 m3-transition flex items-center justify-between"
                                :class="sortOrder === option.value ? 'bg-m3-tertiaryContainer text-m3-onTertiaryContainer' : 'text-m3-onSurface'">
                                <span x-text="option.label"></span>
                                <span x-show="sortOrder === option.value" class="material-symbols-rounded text-[20px]">check</span>
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 md:gap-6">
            <template x-if="loading">
                <template x-for="i in 16">
                    <div class="m3-card overflow-hidden flex flex-col aspect-[4/3]">
                        <div class="w-full h-full relative overflow-hidden skeleton"></div>
                    </div>
                </template>
            </template>

            <!-- Error state: fetch of wallpapers.json failed -->
            <div x-show="!loading && fetchError" x-cloak class="break-inside-avoid flex flex-col items-center justify-center gap-2 min-h-[50vh] text-center w-full" style="column-span: all;">
                <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-m3-errorContainer/30 flex items-center justify-center mb-2">
                    <span class="material-symbols-rounded text-[40px] md:text-[48px] text-m3-error">cloud_off</span>
                </div>
                <h2 class="m3-title-large text-m3-onSurface">Couldn't load wallpapers</h2>
                <p class="m3-body-medium text-m3-onSurfaceVariant max-w-sm">Check your connection and try again.</p>
                <button @click="init()" class="m3-state pill-btn m3-label-large mt-4 px-6 h-10 flex items-center justify-center gap-2 bg-m3-primaryContainer text-m3-onPrimaryContainer m3-ripple">
                    <span class="material-symbols-rounded text-[20px]">refresh</span>
                    <span>Retry</span>
                </button>
            </div>

            <!-- Empty state: search/filter matched nothing -->
            <div x-show="!loading && !fetchError && filteredWallpapers().length === 0" x-cloak class="break-inside-avoid flex flex-col items-center justify-center gap-2 min-h-[50vh] text-center w-full" style="column-span: all;">
                <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-m3-surfaceVariant/30 flex items-center justify-center mb-2">
                    <span class="material-symbols-rounded text-[40px] md:text-[48px] text-m3-onSurfaceVariant">search_off</span>
                </div>
                <h2 class="m3-title-large text-m3-onSurface">No wallpapers match</h2>
                <p class="m3-body-medium text-m3-onSurfaceVariant max-w-sm">Try a different search term or clear the color filter.</p>
                <button @click="resetGallery()" class="m3-state pill-btn m3-label-large mt-4 px-6 h-10 flex items-center justify-center gap-2 bg-m3-secondaryContainer text-m3-onSecondaryContainer m3-ripple">
                    <span class="material-symbols-rounded text-[20px]">clear_all</span>
                    <span>Reset filters</span>
                </button>
            </div>

            <template x-for="wp in filteredWallpapers()" :key="wp.filename">

    <script>
        function galleryApp() {
            return {
                wallpapers: [],
                search: '',
                sortOrder: 'newest',
                selectedColor: '',
                colorSchemes: null,
                loading: true,
                fetchError: false,
                snackbar: '',
                snackbarTimer: null,
                lightboxOpen: false,
                searchOpen: false,
                currentWp: null,
                currentIndex: 0,
                imageLoaded: false,
                dark: true,
                colorGroups: ['Red', 'Orange', 'Yellow', 'Green', 'Blue', 'Purple'],
                sortOptions: [
                    { label: 'Newest', value: 'newest' },
                    { label: 'Oldest', value: 'oldest' },
                    { label: 'A-Z', value: 'az' },
                    { label: 'Z-A', value: 'za' }
                ],

                init() {
                    this.dark = (localStorage.getItem('theme') || 'dark') === 'dark';
                    document.documentElement.classList.toggle('dark', this.dark);
                    document.documentElement.classList.toggle('light', !this.dark);

                    // Restore last picked theme swatch ("All Colors" = '')
                    const savedScheme = localStorage.getItem('colorScheme');
                    if (savedScheme && this.colorGroups.includes(savedScheme)) {
                        this.selectedColor = savedScheme;
                    }
                    this.$watch('selectedColor', v => {
                        localStorage.setItem('colorScheme', v || '');
                        this.applyColorTheme();
                    });

                    // Chromatic M3 schemes (matugen tonal-spot) for the filter swatches
                    fetch('color_schemes.json')
                        .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
                        .then(data => {
                            this.colorSchemes = data;
                            this.applyColorTheme();
                        })
                        .catch(() => { /* filters still work without re-theming */ });

                    this.loading = true;
                    this.fetchError = false;
                    fetch('wallpapers.json')
                        .then(res => {
                            if (!res.ok) throw new Error('Request failed: ' + res.status);
                            return res.json();
                        })
                        .then(data => {
                            this.wallpapers = data;
                            this.loading = false;
                        })
                        .catch(() => {
                            this.fetchError = true;
                            this.loading = false;
                        });
                },

                toggleDark() {
                    this.dark = !this.dark;
                    document.documentElement.classList.toggle('dark', this.dark);
                    document.documentElement.classList.toggle('light', !this.dark);
                    localStorage.setItem('theme', this.dark ? 'dark' : 'light');
                    this.applyColorTheme();
                },

                // Dynamic color: swaps the --md-sys-color-* tokens on <html> to the
                // scheme matching the active filter swatch. '' (All Colors) removes
                // every override so the monochrome default from style.css takes over.
                applyColorTheme() {
                    const rootStyle = document.documentElement.style;
                    const scheme = this.colorSchemes && this.selectedColor
                        ? this.colorSchemes[this.selectedColor] : null;

                    if (!scheme) {
                        rootStyle.removeProperty('--md-sys-active-scheme');
                        for (const name of this._schemeTokenNames || []) rootStyle.removeProperty(name);
                        this._schemeTokenNames = [];
                    } else {
                        const mode = document.documentElement.classList.contains('light') ? 'light' : 'dark';
                        const names = [];
                        for (const [token, value] of Object.entries(scheme[mode])) {
                            const name = '--md-sys-color-' + token;
                            rootStyle.setProperty(name, value);
                            names.push(name);
                        }
                        this._schemeTokenNames = names;
                        rootStyle.setProperty('--md-sys-active-scheme', this.selectedColor);
                    }
                    this.updateMetaThemeColor(scheme);
                },

                updateMetaThemeColor(scheme) {
                    const light = document.documentElement.classList.contains('light');
                    let surface = light ? '#f9f9f9' : '#131313';
                    if (scheme && typeof scheme === 'object') {
                        surface = scheme[light ? 'light' : 'dark']['surface'];
                    }
                    const meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', surface);
                },

                rawUrl(filename) {
                    return 'https://raw.githubusercontent.com/na-ive/wallpapers/main/' + encodeURIComponent(filename);
                },

                showSnackbar(message) {
                    this.snackbar = message;
                    clearTimeout(this.snackbarTimer);
                    this.snackbarTimer = setTimeout(() => { this.snackbar = ''; }, 3000);
                },

                getColorHex(group) {
                    const colors = {
                        'Red': '#f44336', 'Orange': '#ff9800', 'Yellow': '#ffeb3b', 
                        'Green': '#4caf50', 'Blue': '#2196f3', 'Purple': '#9c27b0'
                    };
                    return colors[group] || '#ccc';
                },

                filteredWallpapers() {
                    let result = this.wallpapers.filter(wp => {
                        const matchesSearch = wp.filename.toLowerCase().includes(this.search.toLowerCase());
                        const matchesColor = this.selectedColor === '' || (wp.color_groups && wp.color_groups.includes(this.selectedColor));
                        return matchesSearch && matchesColor;
                    });

                    if (this.sortOrder === 'newest') {
                        result.sort((a, b) => new Date(b.mtime) - new Date(a.mtime));
                    } else if (this.sortOrder === 'oldest') {
                        result.sort((a, b) => new Date(a.mtime) - new Date(b.mtime));
                    } else if (this.sortOrder === 'az') {
                        result.sort((a, b) => a.filename.localeCompare(b.filename));
                    } else if (this.sortOrder === 'za') {
                        result.sort((a, b) => b.filename.localeCompare(a.filename));
                    }

                    return result;
                },

                cleanName(name) {
                    let base = name.replace(/\.[^/.]+$/, "");
                    return base.length > 30 ? base.substring(0, 28) + '...' : base;
                },

                openLightbox(wp) {
                    if (!this.currentWp || this.currentWp.filename !== wp.filename) {
                        this.imageLoaded = false;
                        this.currentWp = wp;
                    }
                    this.currentIndex = this.filteredWallpapers().findIndex(w => w.filename === wp.filename);
                    this.lightboxOpen = true;
                    document.body.style.overflow = 'hidden';
                },

                prevWallpaper() {
                    if (this.currentIndex > 0) {
                        this.imageLoaded = false;
                        this.currentIndex--;
                        this.currentWp = this.filteredWallpapers()[this.currentIndex];
                    }
                },

                nextWallpaper() {
                    if (this.currentIndex < this.filteredWallpapers().length - 1) {
                        this.imageLoaded = false;
                        this.currentIndex++;
                        this.currentWp = this.filteredWallpapers()[this.currentIndex];
                    }
                },

                async downloadWallpaper(wp) {
                    if (!wp) return;
                    this.showSnackbar('Downloading ' + this.cleanName(wp.filename) + '...');
                    try {
                        const url = this.rawUrl(wp.filename);
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('Network error');
                        const blob = await response.blob();
                        const blobUrl = window.URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = blobUrl;
                        a.download = wp.filename;
                        document.body.appendChild(a);
                        a.click();
                        
                        window.URL.revokeObjectURL(blobUrl);
                        document.body.removeChild(a);
                    } catch (error) {
                        console.error('Download error:', error);
                        this.showSnackbar('Failed to download image.');
                    }
                },

                openRandom() {
                    if (this.wallpapers.length > 0) {
                        const randomIndex = Math.floor(Math.random() * this.wallpapers.length);
                        this.openLightbox(this.wallpapers[randomIndex]);
                    }
                },

                closeLightbox() {
                    this.lightboxOpen = false;
                    document.body.style.overflow = 'auto';
                },

                resetGallery() {
                    this.search = '';
                    this.selectedColor = '';
                    this.sortOrder = 'newest';
                    this.searchOpen = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }

        // Global Material Ripple Effect
        document.addEventListener('mousedown', function(e) {
            const target = e.target.closest('.m3-ripple');
            if (!target) return;
            
            // Allow pointer-events: none elements (like icons) to pass clicks through to the .m3-ripple container
            const circle = document.createElement('span');
            const diameter = Math.max(target.clientWidth, target.clientHeight) * 1.5;
            const radius = diameter / 2;

            const rect = target.getBoundingClientRect();
            // Fallback for keyboard clicks or center clicks
            const x = e.clientX === 0 ? rect.width / 2 : e.clientX - rect.left;
            const y = e.clientY === 0 ? rect.height / 2 : e.clientY - rect.top;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${x - radius}px`;
            circle.style.top = `${y - radius}px`;
            circle.classList.add('ripple');

            const existing = target.querySelector('.ripple');
            if (existing) existing.remove();

            target.appendChild(circle);
            
            setTimeout(() => {
                circle.remove();
            }, 600);
        });
    </script>
</body>
